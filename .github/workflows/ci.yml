# CI quality gate (Req 20.1, 20.5, 27.7).
#
# Runs on every pull request against any branch: lints, strict type-checks, and
# runs the Jest suites for both the API and the frontend. Any lint, type, or
# test failure fails the workflow (and blocks merge via branch protection).
# The overall job is bounded to 30 minutes.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Allow manual runs for convenience.
  workflow_dispatch:

# Cancel superseded runs on the same PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # Needed for typecheck: the generated client provides model types.
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck (tsc --strict)
        run: npm run typecheck

      - name: Test
        run: npm test

  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck (tsc --strict)
        run: npm run typecheck

      - name: Test
        run: npm test
