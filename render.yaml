# Render Blueprint for the Inventory Management Dashboard API.
# Render auto-detects this file when you connect the repo.

services:
  - type: web
    name: inventory-api
    runtime: node
    region: ohio          # matches Neon "AWS US East 2 (Ohio)" for lowest latency
    plan: free
    rootDir: api
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/index.js
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: COGNITO_USER_POOL_ID
        sync: false
      - key: COGNITO_CLIENT_ID
        sync: false
      - key: AUTH_MODE
        value: "dev"
      - key: NODE_ENV
        value: "production"