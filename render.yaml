services:
  - type: web
    name: inventory-api
    runtime: node
    region: ohio
    plan: free
    buildCommand: cd api && npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node api/dist/index.js
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AWS_REGION
        value: "us-east-1"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: "placeholder"
      - key: COGNITO_USER_POOL_ID
        value: "placeholder"
      - key: COGNITO_CLIENT_ID
        value: "placeholder"
      - key: AUTH_MODE
        value: "dev"
      - key: NODE_ENV
        value: "production"